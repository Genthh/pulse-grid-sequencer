<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Build a one-bar drum loop with four synthesized voices and sixteen editable steps."
    />
    <title>Pulse Grid — Drum sequencer</title>
    <link rel="stylesheet" href="fonts/type.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="model.js" defer></script>
    <script src="loops.js" defer></script>
    <script src="audio.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <section class="instrument" aria-label="Drum machine">
        <header class="faceplate">
          <div>
            <h1>Pulse Grid</h1>
            <p>Four-voice drum sequencer</p>
          </div>
          <span class="vent" aria-hidden="true"></span>
        </header>
        <div class="controls">
          <div class="transport">
            <p id="status" role="status">Stopped</p>
            <button type="button" id="play">
              <span aria-hidden="true" class="play-icon"></span
              ><span id="play-text">Play</span>
            </button>
          </div>
          <div class="speed">
            <label for="tempo">Tempo</label>
            <div class="speed-line">
              <input
                id="tempo"
                type="range"
                min="50"
                max="190"
                value="112"
              /><output id="tempo-value" for="tempo">112 BPM</output>
            </div>
          </div>
          <div class="patterns">
            <label for="preset">Pattern</label>
            <select id="preset">
              <option value="custom" hidden>Custom loop</option>
              <option value="pocket" selected>Pocket</option>
              <option value="drive">Four on the floor</option>
              <option value="breaks">Broken beat</option>
            </select>
          </div>
        </div>
        <div class="grid-wrap">
          <div class="editor-head">
            <h2>Step editor</h2>
            <span class="grid-hatch" aria-hidden="true"></span>
          </div>
          <p class="directions">
            Tap a pad to add a sixteenth note. Use arrow keys to move between
            pads.
          </p>
          <div id="grid"></div>
        </div>
        <footer>
          <button
            type="button"
            id="share-loop"
            aria-controls="link-panel"
            aria-expanded="false"
          >
            Share loop
          </button>
          <button type="button" id="export-wav">Download WAV</button>
          <button type="button" id="clear">Clear pattern</button>
        </footer>
        <p id="export-status" role="status"></p>
        <div id="link-panel" hidden>
          <label for="share-url">Loop link</label>
          <div class="link-controls">
            <input id="share-url" readonly type="text" /><button
              type="button"
              id="copy-loop"
            >
              Copy link
            </button>
          </div>
        </div>
        <p id="loop-notice" role="status">Edits are saved in this browser.</p>
      </section>
    </main>
  </body>
</html>
